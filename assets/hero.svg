<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Annie — Finance, AI, and products for people</title>
  <desc id="desc">Animated purple night-sky banner with data lines, orbiting particles, and Annie's introduction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090B18"/>
      <stop offset="0.5" stop-color="#18112D"/>
      <stop offset="1" stop-color="#171033"/>
    </linearGradient>
    <linearGradient id="aurora" x1="120" y1="80" x2="1080" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C5CFF"/>
      <stop offset="0.48" stop-color="#D946EF"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#B8A7FF"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#A78BFA" stop-opacity=".48"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="48"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="reveal"><rect x="0" y="0" width="690" height="65"><animate attributeName="width" values="690;690;0;0;690" keyTimes="0;.55;.65;.72;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#B8A7FF" stroke-opacity=".055"/>
    </pattern>
    <style>
      .star { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .float { animation: float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .float2 { animation: float 8s ease-in-out -2s infinite reverse; transform-box: fill-box; transform-origin: center; }
      .orbit { animation: orbit 18s linear infinite; transform-origin: 1000px 210px; }
      .dash { stroke-dasharray: 8 14; animation: dash 12s linear infinite; }
      .pulse { animation: pulse 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .shoot { animation: shoot 7s ease-in-out infinite; }
      @keyframes twinkle { 0%,100%{opacity:.25;transform:scale(.75)} 50%{opacity:1;transform:scale(1.35)} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
      @keyframes orbit { to{transform:rotate(360deg)} }
      @keyframes dash { to{stroke-dashoffset:-220} }
      @keyframes pulse { 0%,100%{opacity:.35;transform:scale(.92)} 50%{opacity:.85;transform:scale(1.08)} }
      @keyframes shoot { 0%,72%{opacity:0;transform:translate(-180px,100px)} 76%{opacity:1} 88%,100%{opacity:0;transform:translate(520px,-220px)} }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="30" fill="url(#grid)"/>
  <ellipse cx="965" cy="205" rx="285" ry="235" fill="url(#glow)" filter="url(#blur)" class="pulse"/>
  <ellipse cx="110" cy="430" rx="260" ry="120" fill="#D946EF" fill-opacity=".16" filter="url(#blur)"/>

  <g opacity=".72">
    <circle class="star" cx="77" cy="75" r="2.5" fill="#fff" style="animation-delay:-1s"/>
    <circle class="star" cx="185" cy="42" r="1.8" fill="#B8A7FF" style="animation-delay:-2s"/>
    <circle class="star" cx="340" cy="84" r="2" fill="#C084FC" style="animation-delay:-.4s"/>
    <circle class="star" cx="520" cy="41" r="1.8" fill="#fff" style="animation-delay:-2.6s"/>
    <circle class="star" cx="649" cy="99" r="2.4" fill="#D946EF" style="animation-delay:-1.4s"/>
    <circle class="star" cx="731" cy="44" r="1.5" fill="#fff" style="animation-delay:-.8s"/>
    <circle class="star" cx="1125" cy="80" r="2.4" fill="#E879F9" style="animation-delay:-2.2s"/>
    <circle class="star" cx="1065" cy="340" r="2" fill="#fff" style="animation-delay:-1.7s"/>
    <circle class="star" cx="778" cy="366" r="1.6" fill="#B8A7FF" style="animation-delay:-.3s"/>
    <circle class="star" cx="565" cy="350" r="2" fill="#fff" style="animation-delay:-2.8s"/>
  </g>

  <g class="shoot" opacity="0">
    <path d="M130 310L305 205" stroke="url(#line)" stroke-width="2"/>
    <circle cx="305" cy="205" r="3" fill="#fff" filter="url(#textGlow)"/>
  </g>

  <g opacity=".44">
    <path d="M0 354C98 334 145 370 230 324C318 276 381 338 466 276C548 216 608 292 700 240C790 189 847 220 930 165C1009 113 1092 145 1200 87" stroke="url(#aurora)" stroke-width="2" class="dash"/>
    <path d="M0 381C105 360 167 391 250 355C335 318 405 358 492 316C592 268 635 322 745 272C834 232 916 260 1001 218C1073 183 1130 197 1200 160" stroke="url(#aurora)" stroke-opacity=".38" class="dash"/>
    <path d="M0 354L0 381M230 324L250 355M466 276L492 316M700 240L745 272M930 165L1001 218M1200 87V160" stroke="#B8A7FF" stroke-opacity=".18"/>
  </g>

  <g transform="translate(78 101)">
    <g class="float">
      <rect width="160" height="30" rx="15" fill="#7C5CFF" fill-opacity=".13" stroke="#A994FF" stroke-opacity=".46"/>
      <circle cx="17" cy="15" r="4" fill="#C084FC"><animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/></circle>
      <text x="31" y="20" fill="#DCD5FF" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700" letter-spacing="2">HELLO, WORLD</text>
    </g>
    <text x="0" y="101" fill="#FFFFFF" font-family="Inter,Segoe UI,sans-serif" font-size="68" font-weight="760" letter-spacing="-2" filter="url(#textGlow)">I'm Annie.</text>
    <g transform="translate(0 120)" clip-path="url(#reveal)">
      <text x="0" y="42" fill="url(#aurora)" font-family="Inter,Segoe UI,sans-serif" font-size="29" font-weight="650" letter-spacing=".5">I research. I design. I build.</text>
    </g>
    <text x="0" y="211" fill="#D8D0F0" font-family="Inter,Segoe UI,sans-serif" font-size="16" letter-spacing="2.3">FINANCE  ×  DATA  ×  AI  ×  PEOPLE</text>
    <rect y="242" width="84" height="3" rx="1.5" fill="url(#aurora)"/>
  </g>

  <g>
    <circle cx="1000" cy="210" r="115" stroke="#A994FF" stroke-opacity=".18"/>
    <circle cx="1000" cy="210" r="82" stroke="#C084FC" stroke-opacity=".22" stroke-dasharray="5 10" class="dash"/>
    <g class="orbit">
      <circle cx="1000" cy="95" r="7" fill="#D946EF" filter="url(#soft)"/>
      <circle cx="1000" cy="95" r="3.2" fill="#F5D0FE"/>
    </g>
    <g class="float2">
      <circle cx="1000" cy="210" r="61" fill="#111426" stroke="url(#aurora)" stroke-width="2"/>
      <circle cx="1000" cy="210" r="49" fill="url(#glow)" opacity=".7"/>
      <text x="1000" y="226" fill="#FFFFFF" text-anchor="middle" font-family="Georgia,serif" font-size="50" font-weight="700" font-style="italic">A</text>
    </g>
    <g class="float" transform="translate(849 106)">
      <rect width="94" height="30" rx="15" fill="#121628" stroke="#7C5CFF" stroke-opacity=".55"/>
      <text x="47" y="20" fill="#CFC5FF" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">RESEARCH</text>
    </g>
    <g class="float2" transform="translate(1054 292)">
      <rect width="78" height="30" rx="15" fill="#17102D" stroke="#C084FC" stroke-opacity=".64"/>
      <text x="39" y="20" fill="#E9D5FF" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">CREATE</text>
    </g>
    <circle cx="866" cy="286" r="5" fill="#C084FC" class="pulse"/>
    <circle cx="1124" cy="151" r="4" fill="#DDD6FE" class="pulse" style="animation-delay:-1.8s"/>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="29" stroke="url(#aurora)" stroke-opacity=".22" stroke-width="2"/>
</svg>
